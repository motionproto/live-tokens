name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Allow manual re-runs from the Actions tab without re-tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.3.3)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # reads Verify's result for this commit
      id-token: write   # required for npm OIDC trusted publishing + provenance

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Refuse to republish an existing version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already on the registry — bump the version and re-tag." >&2
            exit 1
          fi

      # `npm install` (not `npm ci`) because `package-lock.json` is
      # generated on macOS during local releases and cannot capture the
      # linux-only optional binaries that rolldown (bundled with vite 8+)
      # pulls in for the wasm32-wasi fallback path. `npm ci` would exit
      # EUSAGE on the missing @emnapi/* nodes. `npm install` resolves the
      # tree per-platform from package.json. We still gate the publish on
      # the `--frozen` semantics via `Verify tag matches package.json`
      # earlier in the workflow.
      - run: npm install --include=optional --no-audit --no-fund

      # Verify already runs the type check, unit tests, and e2e suite on the
      # push to main that carries this commit. Running them again here doubled
      # a release's wall time, so publish waits on that result instead. A tag
      # on a commit Verify never saw fails here: push it to main first.
      - name: Wait for Verify to pass on this commit
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA=$(git rev-parse HEAD)
          for _ in $(seq 1 24); do
            RUN_ID=$(gh run list --workflow=verify.yml --commit "$SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "No Verify run on $SHA. Push the commit to main, then re-run this workflow." >&2
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status --interval 30 > /dev/null
          echo "Verify run $RUN_ID passed on $SHA."

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Dry-run packaging (catches missing files, bad exports, etc.)
        run: npm pack --dry-run

      # `npm publish` runs `prepublishOnly`, which builds dist-plugin/src/testing-js
      # and then runs every smoke test, including check:smoke-component-tests and
      # check:smoke-page-tests: a real tarball install of check-component --tests
      # and check-page --tests into throwaway consumer projects, minutes long. They
      # need Chromium, already installed above; each installs its own copy too, so
      # a runner with no cache still works, just slower. Keep this after that step
      # if this workflow is reordered.
      - run: npm publish --provenance --access public
