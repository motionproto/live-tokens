name: Verify

# Catches the failure modes that have bitten us right before a publish:
# type errors, broken plugin build, and packaging regressions. If this is
# green on main, `publish.yml` will be too.
#
# Install mirrors publish.yml: `npm install --include=optional` (NOT `npm ci`).
# The package-lock.json is generated on macOS and cannot capture rolldown's
# linux-only `@emnapi/*` optional binaries (the wasm32-wasi fallback bundled
# with vite 8+), so `npm ci` false-fails on linux with EUSAGE. `npm install`
# resolves the tree per-platform from package.json.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install (mirrors publish.yml)
        run: npm install --include=optional --no-audit --no-fund

      - name: Type-check
        run: npm run check

      # Pure Node over the repo, so they need no build and go early: a SKILL.md
      # edited without re-running the two syncs leaves the tree red, and while
      # these gates lived only in `prepublishOnly` it stayed red for a whole
      # session because nothing at commit time looked.
      - name: Skill gates
        run: npm run check:skills && npm run check:skill-atlas && npm run check:skill-sources

      - name: Test
        run: npm test --if-present

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Each worker wants ~1.5 cores for its browser, and the dev server wants
      # more. Four of them on a 4-vCPU runner oversubscribe by 1.5x, and these
      # specs are gated on animation frames, so the frame rate collapses and
      # the suite runs several times slower than it does with half the workers.
      - name: Test live editing in Chromium
        run: npm run test:e2e
        env:
          PLAYWRIGHT_WORKERS: 2

      - name: Build library
        run: npm run build:lib

      - name: Data checks
        run: npm run check:production-is-default && npm run check:component-defaults && npm run check:preset-themes

      # A src/ file importing vite-plugin/ resolves here and in no consumer,
      # because the tarball ships no tooling. Only `check:smoke-install` saw
      # that before, and it runs a tagged release too late.
      - name: Layering check
        run: npm run check:no-tooling-imports

      - name: Verify package contents
        run: npm pack --dry-run
